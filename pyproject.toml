[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightsim-fault-harness"
version = "0.5.0"
description = "Fault-injection and fault-detection test harness on top of JSBSim"
requires-python = ">=3.11"
dependencies = [
    "jsbsim>=1.3.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "anthropic>=0.70",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
